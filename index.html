<!doctype html>
<!-- PhoneSense's small website, published with GitHub Pages: this page, support and privacy. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoneSense</title>
  <meta name="description" content="PhoneSense: a gentle pause before your apps at night, so you put your phone down earlier. No lockouts, no account, no ads.">
  <style>
    :root {
      --bg: #0E0F1A;
      --surface: #171A2B;
      --text: #EDEAF4;
      --muted: #A3A0B8;
      --accent: #F2C98A;
      --rule: #2B2F47;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1d1c2c 0%, var(--bg) 60%);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    main { max-width: 560px; padding: 64px 20px; text-align: center; }
    .moon {
      width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFF1D6 0%, #F2C98A 55%, #E0A960 100%);
      box-shadow: 0 0 60px 10px rgba(242, 201, 138, .25);
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 46px; line-height: 1.1; margin: 0 0 6px; font-weight: 600;
    }
    .tag { font-family: Georgia, serif; font-style: italic; color: var(--accent); font-size: 22px; margin: 0 0 24px; }
    p { color: var(--muted); }
    nav { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    nav a {
      color: var(--text); text-decoration: none; border: 1px solid var(--rule);
      background: var(--surface); border-radius: 999px; padding: 10px 20px; font-weight: 600;
    }
    nav a:hover { border-color: var(--accent); }
    footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true"></div>
  <h1>PhoneSense</h1>
  <p class="tag">Your nights, back.</p>
  <p>A gentle pause before your apps at night, so you put your phone down earlier. You're never locked out. No account, no ads, and what you do stays on your phone.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy-policy.html">Privacy policy</a>
  </nav>
  <footer>Made by OnePrism LLP · <a href="mailto:info@oneprisminnovations.com" style="color: inherit">info@oneprisminnovations.com</a></footer>
</main>
</body>
</html>
